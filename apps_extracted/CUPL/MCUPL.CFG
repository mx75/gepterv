;********************************************************************
;                   MCUPL Configuration File
;********************************************************************
; Machine ID.   If the machine is not an IBM PC/XT/AT compatible,
; specify machine ID here.  You will get a message at MCUPL invoke
; time if the machine is not totally IBM compatible.
; example:  set mid PC      (or)
;           set mid AT
;   PC = 8088/8086 machine
;   AT = 80286 machine
;
set mid AT
;
;********************************************************************
; Library path.  This directory contains the database files (*.DL)
; and overlays files (*.OVR).
;  example:     C:\cupl\
;               \cupl\library\
;
set libpath d:\apps\CUPL\LIB\
;
;*********************************************************************
; Working directory path.  This directory contains all your .PLD files
; that you are working on.
;  example:     C:\cupl\exe\
;               \cupl\examples\
;
;set wdpath D:\trenager\proj.new\ao v0\pld
set wdpath d:\work\z180brd
;
;*********************************************************************
; Text Editor.  This is the editor used by MCUPL.  It requires the
; executable name of your editor or the name of the batch file used to
; execute your editor.
;  example:
;                set editor c:\ME\me      {multi edit}
;               set editor ws      {wordstar}
;               set editor ezedit
;
set editor c:\system\edit.exe
;*********************************************************************
; Color attributes
;
;   set color <position> <color>
;
;   MCFG = Message Center foreground
;   MCBG = Message Center background
;   MCBC = Message Center border color
;   UIFG = User Input foreground
;   UIBG = User Input background
;   UIBC = User Input border color
;   MMFG = Main Menu foreground
;   MMBG = Main Menu background
;   MMBC = Main Menu border color
;   color = BLACK, BLUE, GREEN, CYAN, RED, MAGENTA, BROWN, LIGHTGREY
;           DARKGREY, LIGHTBLUE, LIGHTGREEN, LIGHTCYAN, LIGHTRED
;           LIGHTMAGENTA, YELLOW, WHITE
;
set color MCFG WHITE
set color MCBG GREEN
set color MCBC BLACK
set color UIFG WHITE
set color UIBG LIGHTRED
set color UIBC WHITE
set color MMFG WHITE
set color MMBG LIGHTBLUE
set color MMBC LIGHTCYAN
;
;*********************************************************************
; Function Key Definition.  This will allow you to define a series of
; commands to a function key.  Keys F6-F10 can be defined.  The following
; example will select the P16L8 device when F6 is pressed.
;  example:     def F6 DP67
;               def F0 DE4          {F0 represents F10}
;
def F6 DP67     { P16L8 }
def F7 DP71     { P16R4 }
def F8 DP72     { P16R6 }
def F9 DP73     { P16R8 }
;
